<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" width="960" height="616" role="img" aria-labelledby="t d"><title id="t">Diagrama de casos de uso do Imports Intelligence</title><desc id="d">Comprador, Gestor e Fornecedor interagem com oito casos de uso: cadastrar pedido, simular custos, enviar pedido de cotação (automático), responder com a proposta (ação do fornecedor), ler e padronizar propostas, calcular custo e ranquear, revisar e aprovar a compra e acompanhar painel e alertas.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap');
