.h{font-size:12px;font-weight:600;letter-spacing:1.2px;fill:#0A0F14}
.m{font-size:13px;fill:#55636E}
.uc{font-size:15px;font-weight:500}
.ac{font-size:14px;font-weight:600;fill:#0A0F14}
.as{font-size:12px;fill:#55636E}
.en{font-size:14px;font-weight:600}
.at{font-size:13px;fill:#0A0F14}
.rl{font-size:12px;fill:#55636E}
</style><rect x="0.5" y="0.5" width="959" height="615" fill="#FBFAF7" stroke="#0A0F14"/><path d="M0 44.5H960" stroke="#0A0F14"/><text x="24" y="28" class="h">DIAGRAMA DE CASOS DE USO</text><text x="936" y="28" text-anchor="end" class="m">Imports Intelligence</text><rect x="230.5" y="64.5" width="500" height="492" fill="none" stroke="#55636E" stroke-dasharray="5 4"/><text x="250" y="86" class="m">Sistema</text><line x1="132" y1="286" x2="290" y2="118" stroke="#0A0F14" stroke-width="1"/><line x1="132" y1="286" x2="290" y2="174" stroke="#0A0F14" stroke-width="1"/><line x1="132" y1="286" x2="290" y2="454" stroke="#0A0F14" stroke-width="1"/><line x1="132" y1="482" x2="290" y2="454" stroke="#0A0F14" stroke-width="1"/><line x1="132" y1="482" x2="290" y2="510" stroke="#0A0F14" stroke-width="1"/><line x1="828" y1="258" x2="670" y2="230" stroke="#0A0F14" stroke-width="1"/><line x1="828" y1="258" x2="670" y2="286" stroke="#0A0F14" stroke-width="1"/><ellipse cx="480" cy="118" rx="190" ry="25" fill="#F3F1EC" stroke="#0A0F14" stroke-width="1"/><text x="480" y="123" text-anchor="middle" class="uc" fill="#0A0F14">Cadastrar pedido de cotação</text><ellipse cx="480" cy="174" rx="190" ry="25" fill="#F3F1EC" stroke="#0A0F14" stroke-width="1"/><text x="480" y="179" text-anchor="middle" class="uc" fill="#0A0F14">Simular custos e impostos</text><ellipse cx="480" cy="230" rx="190" ry="25" fill="#0A0F14" stroke="#0A0F14" stroke-width="1"/><text x="480" y="235" text-anchor="middle" class="uc" fill="#FBFAF7">Enviar pedido de cotação</text><ellipse cx="480" cy="286" rx="190" ry="25" fill="#F3F1EC" stroke="#0A0F14" stroke-width="1"/><text x="480" y="291" text-anchor="middle" class="uc" fill="#0A0F14">Responder com a proposta</text><ellipse cx="480" cy="342" rx="190" ry="25" fill="#0A0F14" stroke="#0A0F14" stroke-width="1"/><text x="480" y="347" text-anchor="middle" class="uc" fill="#FBFAF7">Ler e padronizar propostas</text><ellipse cx="480" cy="398" rx="190" ry="25" fill="#0A0F14" stroke="#0A0F14" stroke-width="1"/><text x="480" y="403" text-anchor="middle" class="uc" fill="#FBFAF7">Calcular custo e ranquear</text><ellipse cx="480" cy="454" rx="190" ry="25" fill="#F2DE8C" stroke="#0A0F14" stroke-width="1"/><text x="480" y="459" text-anchor="middle" class="uc" fill="#0A0F14">Revisar e aprovar a compra</text><ellipse cx="480" cy="510" rx="190" ry="25" fill="#F3F1EC" stroke="#0A0F14" stroke-width="1"/><text x="480" y="515" text-anchor="middle" class="uc" fill="#0A0F14">Acompanhar painel e alertas</text><circle cx="110" cy="263" r="11" fill="#FBFAF7" stroke="#0A0F14" stroke-width="1.5"/><path d="M110 274V310M90 286H130M110 310L95 334M110 310L125 334" fill="none" stroke="#0A0F14" stroke-width="1.5" stroke-linecap="round"/><text x="110" y="358" text-anchor="middle" class="ac">Comprador</text><text x="110" y="376" text-anchor="middle" class="as">Setor de compras</text><circle cx="110" cy="459" r="11" fill="#FBFAF7" stroke="#0A0F14" stroke-width="1.5"/><path d="M110 470V506M90 482H130M110 506L95 530M110 506L125 530" fill="none" stroke="#0A0F14" stroke-width="1.5" stroke-linecap="round"/><text x="110" y="554" text-anchor="middle" class="ac">Gestor</text><text x="110" y="572" text-anchor="middle" class="as">Revisão e alertas</text><circle cx="850" cy="235" r="11" fill="#FBFAF7" stroke="#0A0F14" stroke-width="1.5"/><path d="M850 246V282M830 258H870M850 282L835 306M850 282L865 306" fill="none" stroke="#0A0F14" stroke-width="1.5" stroke-linecap="round"/><text x="850" y="330" text-anchor="middle" class="ac">Fornecedor</text><text x="850" y="348" text-anchor="middle" class="as">Responde por e-mail</text><rect x="30.5" y="587.5" width="14" height="14" fill="#F3F1EC" stroke="#0A0F14"/><text x="52" y="599" class="m">Ação de uma pessoa</text><rect x="215.5" y="587.5" width="14" height="14" fill="#0A0F14" stroke="#0A0F14"/><text x="237" y="599" class="m">Automático (regras e IA)</text><rect x="425.5" y="587.5" width="14" height="14" fill="#F2DE8C" stroke="#0A0F14"/><text x="447" y="599" class="m">Decisão humana</text></svg>